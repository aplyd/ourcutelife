name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:fix
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  convex-deploy:
    name: Deploy Convex
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Convex
        shell: bash
        run: |
          set +e
          deploy_output="$(pnpm convex:deploy 2>&1)"
          deploy_status=$?
          printf '%s\n' "$deploy_output"
          if [ "$deploy_status" -ne 0 ]; then
            diagnostic="$(printf '%s' "$deploy_output" | node -e '
              const fs = require("node:fs");
              const lines = fs.readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean).slice(-12);
              const escaped = lines.join(" | ").replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
              process.stdout.write(escaped.slice(0, 3500));
            ')"
            echo "::error title=Convex deploy failed::$diagnostic"
            exit "$deploy_status"
          fi

  eas-update-ios:
    name: EAS iOS OTA update
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_CONVEX_URL: https://usable-tapir-102.convex.cloud
      EXPO_PUBLIC_CONVEX_SITE_URL: https://usable-tapir-102.convex.site
      EXPO_PUBLIC_CONVEX_HTTP_ACTIONS_URL: https://usable-tapir-102.convex.site
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm update:ios --non-interactive
